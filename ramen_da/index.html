<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ラーメン打</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .game-container {
            font-family: 'Mochiy Pop One', sans-serif;
        }
        canvas {
            background-color: #f0eada;
            background-image:
                linear-gradient(rgba(200, 160, 120, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(200, 160, 120, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            border-radius: 0.75rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 5px solid #d4c0a1;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen text-white p-4">

    <div id="game-container" class="w-full max-w-4xl text-center game-container">
        <h1 id="game-title" class="text-5xl md:text-6xl font-bold mb-4 text-amber-400" style="text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">ラーメン打</h1>
        <div id="canvas-wrapper" class="relative w-full aspect-[16/9] mx-auto">
            <canvas id="gameCanvas" class="w-full h-full"></canvas>
        </div>
        <p id="loading-text" class="mt-4 text-lg">読み込み中...</p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/ramen.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
