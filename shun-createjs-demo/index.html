<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR &amp; BOMB CATCH</title>
  <script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>

  <!-- global.js → 各機能の順に読み込みます -->
  <script src="global.js"></script>
  <script src="student.js"></script>
  <script src="key.js"></script>
  <script src="mouse.js"></script>
  <script src="gameover.js"></script>
  <script src="tick.js"></script>
  <script src="init.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1120;
      color: #ffffff;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }
    main { text-align: center; padding: 20px; }
    h1 { margin: 0 0 8px; color: #ffe36e; }
    canvas {
      max-width: 100%;
      height: auto;
      border: 3px solid #c8dcff;
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
    }
    p { margin: 8px 0 0; line-height: 1.7; }
    code { background: #223558; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>★ STAR &amp; BOMB CATCH ★</h1>
    <canvas id="myCanvas" width="600" height="600"></canvas>
    <p>操作：<strong>← →</strong> または <strong>A D</strong> ／ スタート・再開：<strong>SPACE</strong> または画面クリック</p>
    <p>画像・効果音の追加方法は <code>STUDENT_README.md</code> を見よう。</p>
  </main>
</body>
</html>
