<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CreateJS 横スクロールゲーム教材</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101827;
      color: white;
    }

    main {
      width: min(100%, 1040px);
      padding: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(20px, 3vw, 30px);
    }

    .help {
      margin: 0 0 12px;
      line-height: 1.7;
      color: #d9e7ff;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 4px solid #ffffff;
      border-radius: 12px;
      overflow: hidden;
      background: #7dd3fc;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #7dd3fc;
    }

    #errorPanel {
      display: none;
      position: absolute;
      inset: auto 12px 12px 12px;
      max-height: 40%;
      overflow: auto;
      padding: 12px 14px;
      border: 2px solid #ffe08a;
      border-radius: 8px;
      background: rgba(100, 20, 20, 0.94);
      color: #fff8d8;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.55;
    }

    .note {
      margin: 12px 0 0;
      font-size: 14px;
      color: #b9c9e3;
    }

    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #26354e;
    }
  </style>

  <script>
    window.__showLessonError = function (message) {
      const panel = document.getElementById("errorPanel");
      if (!panel) return;
      panel.style.display = "block";
      panel.textContent =
        "プログラムにエラーがあります。\n" +
        "直したら Ctrl + S で保存し、ブラウザを再読み込みしてください。\n\n" +
        message;
    };

    window.addEventListener("error", function (event) {
      const file = event.filename ? event.filename.split("/").pop() : "不明なファイル";
      const line = event.lineno || "?";
      window.__showLessonError(file + " の " + line + " 行目付近\n" + event.message);
    });
  </script>

  <script>
    function loadLessonScript(src, timeoutMs) {
      return new Promise(function (resolve, reject) {
        const script = document.createElement("script");
        let finished = false;

        const finish = function (error) {
          if (finished) return;
          finished = true;
          clearTimeout(timer);
          if (error) reject(error); else resolve();
        };

        script.src = src;
        script.async = false;
        script.onload = function () { finish(); };
        script.onerror = function () { finish(new Error(src + " を読み込めませんでした")); };
        document.head.appendChild(script);

        const timer = setTimeout(function () {
          script.remove();
          finish(new Error(src + " の読み込みがタイムアウトしました"));
        }, timeoutMs || 2500);
      });
    }

    async function bootLessonGame() {
      const forceOffline = new URLSearchParams(location.search).has("offline");

      if (!forceOffline) {
        try {
          await loadLessonScript("https://code.createjs.com/1.0.0/createjs.min.js", 1800);
        } catch (error) {
          console.warn(error.message);
        }
      }

      if (!window.createjs) {
        await loadLessonScript("createjs-fallback.js", 2500);
      }

      // 生徒が触る順番どおりに読み込みます。
      await loadLessonScript("settings.js", 2500);
      await loadLessonScript("student.js", 2500);
      await loadLessonScript("game.js", 2500);
    }

    window.addEventListener("DOMContentLoaded", function () {
      bootLessonGame().catch(function (error) {
        window.__showLessonError(error.stack || error.message || String(error));
      });
    });
  </script>
</head>
<body>
  <main>
    <h1>CreateJS 横スクロールゲーム</h1>
    <p class="help">
      移動：← → または A D ／ ジャンプ：↑・W・スペース ／ やり直し：R ／ 音：M
    </p>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      <div id="errorPanel" role="alert"></div>
    </div>

    <p class="note">
      最初の改造は <code>settings.js</code> だけでできます。保存後、ブラウザを再読み込みすると変化を確認できます。
    </p>
  </main>
</body>
</html>
